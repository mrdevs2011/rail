<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Rail Browser</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
:root { --bg: #000000; --fg: #ededed; --dim: #525252; --line-hi: #3a3a3a; --acc: #38bdf8; --panel: #0c0c0c; --line: #1f1f1f; }
html, body { height: 100%; }
body {
  min-height: 100vh; min-height: 100svh; display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'DejaVu Sans Mono', ui-monospace, monospace;
  user-select: none; padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
}
/* The block is vertically centered once; the suggestion list and the profile menu are
   absolutely positioned dropdowns, so nothing ever shifts or floats away from the brand. */
.container { width: 100%; max-width: 580px; display: flex; flex-direction: column; align-items: flex-start; gap: 28px; animation: fadeIn 160ms ease-out; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.brand-title { font-size: 46px; font-weight: 700; letter-spacing: -0.05em; color: var(--fg); line-height: 1; }
.brand-title .dot { color: var(--acc); }
.brand-subtitle { margin-top: 10px; font-size: 12px; color: var(--dim); }

.omni { position: relative; width: 100%; }
.bar { display: flex; align-items: center; gap: 10px; width: 100%; height: 40px; }
.gicon { width: 20px; height: 20px; flex: none; display: inline-flex; }
.gicon svg { width: 20px; height: 20px; }
#q {
  flex: 1; min-width: 0; height: 40px;
  background: transparent !important; border: 0 !important; border-radius: 0 !important; box-shadow: none !important;
  padding: 0 !important; outline: none !important;
  font: inherit; font-size: 14px; color: var(--fg); caret-color: var(--acc); cursor: text;
}
#q::placeholder { color: var(--dim); }
#q::selection { background: #2b4a63; color: #fff; }
.pbtn {
  flex: none; width: 24px; height: 24px; border-radius: 50%; border: 0; cursor: pointer;
  font: inherit; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center;
}
.pbtn:hover { filter: brightness(1.12); }

.hint { margin-top: 6px; display: flex; gap: 26px; font-size: 10px; color: var(--dim); white-space: nowrap; overflow: hidden; }
.hint .k { color: #6a6a6a; margin-right: 6px; }
.hint .v { color: var(--dim); }

.panel {
  position: absolute; left: 0; right: 0; top: 100%; z-index: 10;
  background: var(--bg); border-top: 1px solid var(--line); padding-top: 4px;
}
.panel[hidden], .pmenu[hidden] { display: none; }
.sugs { max-height: 220px; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #2a2a2a transparent; }
.sug { display: flex; align-items: center; gap: 8px; padding: 7px 6px; border-radius: 4px; cursor: pointer; font-size: 12px; }
.sug:hover, .sug.sel { background: #121212; }
.sug.sel { box-shadow: inset 2px 0 0 var(--acc); }
.sug .ic { width: 14px; height: 14px; flex: none; color: var(--dim); display: inline-flex; }
.sug .ic svg { width: 14px; height: 14px; }
.sug .t { color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 55%; flex: none; }
.sug .u { color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
.sug .t.only { flex: 1; max-width: none; }
.sug .b { flex: none; margin-left: auto; font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: #8a8a8a; border: 1px solid #2a2a2a; border-radius: 3px; padding: 2px 6px; }

.pmenu {
  position: absolute; right: 0; top: 46px; z-index: 20; width: 250px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 6px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.7);
}
.pmenu .ttl { font-size: 9px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); padding: 6px 8px 8px; }
.pitem { display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 4px; cursor: pointer; }
.pitem:hover { background: #151515; }
.pitem.sel { background: #151515; box-shadow: inset 2px 0 0 var(--fg); }
.pitem .dot { width: 24px; height: 24px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; }
.pitem .nm { font-size: 12px; font-weight: 700; color: var(--fg); }
.pitem .ps { font-size: 9px; color: var(--dim); margin-top: 1px; }
.pitem .col { flex: 1; min-width: 0; }
.pitem .ck { color: var(--fg); font-size: 12px; }
.pmenu .sep { height: 1px; background: var(--line); margin: 6px 2px; }
.pmenu .manage { display: flex; align-items: center; gap: 8px; padding: 8px; font-size: 10px; font-weight: 700; color: var(--fg); border-radius: 4px; cursor: pointer; }
.pmenu .manage:hover { background: #151515; }

/* Keyboard shortcuts: compact, readable cards instead of a long unstyled list. */
.container { max-width: 820px; gap: 23px; }
.shortcuts { width: 100%; margin-top: 0; padding-top: 13px; border-top: 1px solid #202a33; }
.shortcuts-head { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; min-height: 25px; }
.shortcuts-title { color: #b9c9d5; font: 700 10px/1.2 'DejaVu Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.shortcuts-caption { color: #596b79; font: 9px/1.2 'DejaVu Sans', sans-serif; }
.shortcuts-toggle { margin-left: auto; flex: none; border: 1px solid #293640; border-radius: 5px; background: #0b1116; color: #8aaebe; padding: 5px 8px; font: 600 9px/1 'DejaVu Sans', sans-serif; cursor: pointer; transition: background .15s, border-color .15s; }
.shortcuts-toggle:hover { background: #152633; border-color: #3b6b83; }
.shortcuts-toggle:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.shortcut-groups { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: start; gap: 8px; }
.shortcut-group { min-width: 0; padding: 8px 9px 5px; border: 1px solid #1c2831; border-radius: 7px; background: #080d11; }
.shortcut-group-title { margin: 0 0 4px; color: #7893a5; font: 700 8px/1.4 'DejaVu Sans', sans-serif; letter-spacing: .12em; text-transform: uppercase; }
.shortcut-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; min-height: 27px; padding: 4px 2px; border-top: 1px solid rgba(125,155,178,.08); }
.shortcut-row:first-of-type { border-top: 0; }
.shortcut-row:hover { background: rgba(116,180,211,.055); }
.shortcut-row.primary .shortcut-desc { color: #e6f2fa; }
.shortcut-desc { min-width: 0; color: #9aaab5; font: 9px/1.3 'DejaVu Sans', sans-serif; overflow-wrap: anywhere; }
.shortcut-keys { display: flex; flex: none; justify-content: flex-end; align-items: center; flex-wrap: wrap; gap: 3px; max-width: 58%; }
.shortcut-key { display: inline-flex; align-items: center; min-height: 19px; padding: 2px 5px; border: 1px solid #2b3a45; border-radius: 4px; background: #111a21; color: #c1d2dd; font: 600 8px/1.2 'DejaVu Sans Mono', monospace; white-space: nowrap; }
.shortcut-off { color: #687887; font: 9px/1.2 'DejaVu Sans', sans-serif; }
@media (min-width: 521px) and (max-width: 760px) {
  .shortcut-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) {
  body { align-items: flex-start; padding-top: max(22vh, 72px); }
  .container { gap: 22px; max-width: 100%; }
  .shortcut-groups { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .shortcuts { padding-top: 14px; }
  .shortcut-group { padding: 8px 8px 5px; }
  .brand-title { font-size: clamp(34px, 11vw, 46px); }
  .brand-subtitle { font-size: 10px; line-height: 1.5; overflow-wrap: anywhere; }
  .bar { gap: 8px; }
  #q { font-size: 13px; }
  .hint { gap: 12px; white-space: normal; flex-wrap: wrap; line-height: 1.6; }
  .pmenu { width: min(250px, calc(100vw - 40px)); }
  .sugs { max-height: min(38vh, 220px); }
}
@media (max-width: 360px) {
  body { padding-left: 14px; padding-right: 14px; }
  .brand-title { font-size: 34px; }
  .sug { gap: 6px; padding-left: 3px; padding-right: 3px; }
  .shortcut-desc { font-size: 9px; }
  .shortcut-key { font-size: 8px; padding-left: 5px; padding-right: 5px; }
  .shortcuts-caption { display: none; }
  .sug .t { max-width: 42%; }
}
@media (prefers-reduced-motion: reduce) {
  .container { animation: none; }
}
</style>
</head>
<body>
<div class="container">
  <div class="brand-area">
    <div class="brand-title">rail<span class="dot">.</span></div>
    <div class="brand-subtitle">fast pages many workspaces with RAIL</div>
  </div>
  <div class="omni" id="omni">
    <div class="bar">
      <span class="gicon" id="gicon"></span>
      <input id="q" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus placeholder="" aria-label="">
      <button class="pbtn" id="pbtn" type="button" tabindex="-1" style="display:none"></button>
    </div>
    <div class="hint" id="hint"></div>
    <div class="panel" id="panel" hidden>
      <div class="sugs" id="sugs"></div>
      <div class="hint" id="hint2"></div>
    </div>
    <div class="pmenu" id="pmenu" hidden></div>
  </div>
  <section class="shortcuts" aria-labelledby="shortcuts-title">
    <div class="shortcuts-head">
      <div class="shortcuts-title" id="shortcuts-title">Keyboard shortcuts</div>
      <div class="shortcuts-caption" id="shortcuts-caption">Quick reference</div>
      <button class="shortcuts-toggle" id="shortcuts-toggle" type="button" aria-expanded="false">Show all</button>
    </div>
    <div class="shortcut-groups" id="shortcut-groups"></div>
  </section>
</div>
<script>
(function () {
  var q = document.getElementById('q'), pbtn = document.getElementById('pbtn');
  var pmenu = document.getElementById('pmenu'), panel = document.getElementById('panel');
  var sugsEl = document.getElementById('sugs'), hint = document.getElementById('hint'), hint2 = document.getElementById('hint2');
  var S = { profiles: [], shortcuts: [], selected: '', badges: ['History', 'Top', 'Search'], hint: '', selTitle: '', manage: '', shortcutTitle: 'Keyboard shortcuts', shortcutCaption: 'Quick reference', showAll: 'Show all shortcuts', showLess: 'Show fewer' };
  var shortcutsExpanded = false;
  var sugs = [], sel = -1, prevLen = 0, deleting = false, lastQ = '', fwd = false;
  var ICONS = [
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>'
  ];
  var WRENCH = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0 5 5L22 9.6V6.5l-2.4 2.4-2.1-.4-.4-2.1L19.5 4h-3.1zM3 21l9.5-9.5-2-2L3 17z"/></svg>';

  function post(m) { try { window.webkit.messageHandlers.railgo.postMessage(m); } catch (e) {} }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function fillHint(node) {
    node.textContent = '';
    (S.hint || '').split(/\s{4,}/).forEach(function (seg) {
      if (!seg.trim()) return;
      var m = seg.match(/^(\S+)\s{2,}(.*)$/), sp = el('span');
      if (m) { sp.appendChild(el('span', 'k', m[1])); sp.appendChild(el('span', 'v', m[2])); }
      else { sp.appendChild(el('span', 'v', seg.trim())); }
      node.appendChild(sp);
    });
  }
  function curProfile() {
    for (var i = 0; i < S.profiles.length; i++) if (S.profiles[i].id === S.selected) return S.profiles[i];
    return S.profiles[0];
  }
  function renderBtn() {
    var p = curProfile();
    if (!p) { pbtn.style.display = 'none'; return; }
    pbtn.style.display = ''; pbtn.textContent = p.letter; pbtn.style.background = p.bg; pbtn.style.color = p.fg;
  }
  function renderMenu() {
    pmenu.textContent = '';
    pmenu.appendChild(el('div', 'ttl', S.selTitle));
    S.profiles.forEach(function (p) {
      var row = el('div', 'pitem' + (p.id === S.selected ? ' sel' : ''));
      var dot = el('span', 'dot', p.letter); dot.style.background = p.bg; dot.style.color = p.fg;
      var col = el('div', 'col'); col.appendChild(el('div', 'nm', p.name)); col.appendChild(el('div', 'ps', p.persona));
      row.appendChild(dot); row.appendChild(col);
      if (p.id === S.selected) row.appendChild(el('span', 'ck', '\u2713'));
      row.addEventListener('mousedown', function (e) { e.preventDefault(); });
      row.addEventListener('click', function () { S.selected = p.id; renderBtn(); renderMenu(); pmenu.hidden = true; q.focus(); });
      pmenu.appendChild(row);
    });
    pmenu.appendChild(el('div', 'sep'));
    var mg = el('div', 'manage'); mg.innerHTML = WRENCH; mg.appendChild(el('span', null, S.manage));
    mg.addEventListener('mousedown', function (e) { e.preventDefault(); });
    mg.addEventListener('click', function () { pmenu.hidden = true; post('manage\t'); });
    pmenu.appendChild(mg);
  }
  function renderSugs() {
    sugsEl.textContent = '';
    sugs.forEach(function (s, i) {
      var row = el('div', 'sug' + (i === sel ? ' sel' : ''));
      var ic = el('span', 'ic'); ic.innerHTML = ICONS[s.kind] || ICONS[0]; row.appendChild(ic);
      row.appendChild(el('span', 't' + (s.kind === 2 ? ' only' : ''), s.title));
      if (s.kind !== 2) row.appendChild(el('span', 'u', s.url));
      row.appendChild(el('span', 'b', S.badges[s.kind] || ''));
      row.addEventListener('mousedown', function (e) { e.preventDefault(); });
      row.addEventListener('click', function () { go(s.target); });
      sugsEl.appendChild(row);
    });
    panel.hidden = !sugs.length;
    hint.style.visibility = sugs.length ? 'hidden' : 'visible';
    var selEl = sugsEl.querySelector('.sel'); if (selEl && selEl.scrollIntoView) selEl.scrollIntoView({ block: 'nearest' });
  }
  function go(text) {
    if (!text || !text.trim()) return;
    post('go\t' + S.selected + '\t' + text);
  }
  function clearAll() { q.value = ''; prevLen = 0; sugs = []; sel = -1; lastQ = ''; renderSugs(); }
  function move(d) {
    if (!sugs.length) return;
    var n = sugs.length;
    sel = sel < 0 ? (d > 0 ? 0 : n - 1) : (sel + d < 0 ? n - 1 : (sel + d >= n ? 0 : sel + d));
    var s = sugs[sel];
    q.value = s.kind === 2 ? s.autofill : s.url;
    prevLen = q.value.length;
    try { q.setSelectionRange(q.value.length, q.value.length); } catch (e) {}
    renderSugs();
  }

  function renderShortcuts() {
    var root = document.getElementById('shortcut-groups'); root.textContent = '';
    var all = S.shortcuts || [];
    var visible = shortcutsExpanded ? all : all.filter(function (item) { return item.important; });
    var groups = {}, order = [];
    visible.forEach(function (item) {
      if (!groups[item.group]) { groups[item.group] = []; order.push(item.group); }
      groups[item.group].push(item);
    });
    order.forEach(function (name) {
      var card = el('section', 'shortcut-group');
      card.appendChild(el('h2', 'shortcut-group-title', name));
      groups[name].forEach(function (item) {
        var row = el('div', 'shortcut-row' + (item.important ? ' primary' : ''));
        row.appendChild(el('div', 'shortcut-desc', item.desc));
        var keys = el('div', 'shortcut-keys');
        if (!item.enabled || !item.combo) keys.appendChild(el('span', 'shortcut-off', 'O‘chirilgan'));
        else item.combo.split(' · ').forEach(function (combo) { keys.appendChild(el('kbd', 'shortcut-key', combo)); });
        row.appendChild(keys); card.appendChild(row);
      });
      root.appendChild(card);
    });
    var toggle = document.getElementById('shortcuts-toggle');
    toggle.hidden = all.length === visible.length;
    toggle.textContent = shortcutsExpanded ? S.showLess : S.showAll + ' · ' + all.length;
    toggle.setAttribute('aria-expanded', shortcutsExpanded ? 'true' : 'false');
  }
  document.getElementById('shortcuts-toggle').addEventListener('click', function () {
    shortcutsExpanded = !shortcutsExpanded;
    renderShortcuts();
  });

  window.railState = function (st) {
    var keep = S.selected;
    S = st;
    if (keep && S.profiles.some(function (p) { return p.id === keep; })) S.selected = keep;
    document.getElementById('shortcuts-title').textContent = st.shortcutTitle || S.shortcutTitle;
    document.getElementById('shortcuts-caption').textContent = st.shortcutCaption || S.shortcutCaption;
    S.showAll = st.showAll || S.showAll; S.showLess = st.showLess || S.showLess;
    q.placeholder = st.placeholder || '';
    q.setAttribute('aria-label', st.placeholder || '');
    document.getElementById('gicon').innerHTML = st.engineSvg || '';
    fillHint(hint); fillHint(hint2); renderBtn(); renderMenu(); renderShortcuts();
  };
  window.railSugg = function (text, arr) {
    if (text !== lastQ) return;               // stale answer
    sugs = arr || []; sel = -1;
    var hasSpace = text.indexOf(' ') !== -1 || text.endsWith(' ');
    if (fwd && !hasSpace && sugs.length && sugs[0].kind !== 2) {
      var clean = text.trim().toLowerCase(), af = sugs[0].autofill || '';
      if (af && af.toLowerCase().indexOf(clean) === 0 && af.length > text.length && q.value === text) {
        q.value = af; q.setSelectionRange(text.length, af.length); prevLen = text.length;
      }
    }
    renderSugs();
  };
  window.railToggleProfiles = function () { pmenu.hidden = !pmenu.hidden; };

  q.addEventListener('keydown', function (e) {
    deleting = (e.key === 'Backspace' || e.key === 'Delete');
    if (e.key === 'Enter') { e.preventDefault(); go(sel >= 0 && sugs[sel] ? sugs[sel].target : q.value); }
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { if (sugs.length) { e.preventDefault(); move(e.key === 'ArrowDown' ? 1 : -1); } }
    else if (e.key === 'Escape') {
      e.preventDefault();
      if (!pmenu.hidden) pmenu.hidden = true;
      else if (sugs.length || q.value) clearAll();
      else q.blur();
    }
  });
  q.addEventListener('input', function () {
    var v = q.value;
    fwd = v.length > prevLen && !deleting;
    prevLen = v.length; sel = -1;
    if (!v.trim()) { sugs = []; lastQ = ''; renderSugs(); return; }
    lastQ = v; post('q\t' + v);
  });
  pbtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  pbtn.addEventListener('click', function () { pmenu.hidden = !pmenu.hidden; });
  document.addEventListener('mousedown', function (e) {
    if (!e.target.closest('#pmenu') && e.target !== pbtn) pmenu.hidden = true;
    if (!e.target.closest('#pmenu,#pbtn,.sug,#q')) { e.preventDefault(); q.focus(); }
  });
  window.addEventListener('load', function () { q.focus(); post('init\t'); });
  post('init\t');
})();
</script>
</body>
</html>
