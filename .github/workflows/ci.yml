name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rail-linux:
    name: Rail (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Rename asset
        run: cp target/release/rail target/release/rail-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rail-linux-x86_64
          path: target/release/rail-linux-x86_64
          if-no-files-found: error

  spike:
    name: Spike (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux deps (webkit/gtk for wry)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/spike-tao-wry

      - name: Build spike
        working-directory: examples/spike-tao-wry
        run: cargo build --release

      - name: Upload spike binary
        uses: actions/upload-artifact@v4
        with:
          name: spike-${{ matrix.label }}
          path: |
            examples/spike-tao-wry/target/release/spike-tao-wry
            examples/spike-tao-wry/target/release/spike-tao-wry.exe
          if-no-files-found: ignore
