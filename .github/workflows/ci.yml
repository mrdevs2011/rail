name: CI

# main ga push da build/test/release .github/workflows/release.yml da bajariladi
# (ikki marta build bo'lmasligi uchun). Bu yerda faqat pull request tekshiriladi.
on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rail-linux:
    name: Rail (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Test
        run: cargo test --release

      - name: Rename asset
        run: cp target/release/rail target/release/rail-linux-x86_64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rail-linux-x86_64
          path: target/release/rail-linux-x86_64
          if-no-files-found: error
