name: Auto release

# main ga har push → patch versiya oshadi + GitHub Release (rail-linux-x86_64)
on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: auto-release-main
  cancel-in-progress: false

jobs:
  release:
    name: Bump, build & release (Linux)
    runs-on: ubuntu-latest
    # Botning o'z versiya-bump commitida qayta ishlamasin (loop yo'q)
    if: >-
      github.event.head_commit &&
      !contains(github.event.head_commit.message, '[skip release]') &&
      !startsWith(github.event.head_commit.message, 'chore: bump version')

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version
        id: ver
        run: |
          set -euo pipefail
          OLD=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          IFS=. read -r MAJ MIN PAT <<< "$OLD"
          NEW="${MAJ}.${MIN}.$((PAT + 1))"
          echo "Bump $OLD → $NEW"

          sed -i "s/^version = \"${OLD}\"/version = \"${NEW}\"/" Cargo.toml

          if [ -f package.json ]; then
            sed -i "s/\"version\": \"${OLD}\"/\"version\": \"${NEW}\"/" package.json || true
            # ba'zi package.json da version boshqa formatda bo'lishi mumkin
            python3 - <<PY
          import json, pathlib
          p = pathlib.Path("package.json")
          if p.exists():
              data = json.loads(p.read_text())
              data["version"] = "${NEW}"
              p.write_text(json.dumps(data, indent=2) + "\n")
          PY
          fi

          # sayt badge lari
          for f in index.html $(find docs -name '*.html' 2>/dev/null); do
            [ -f "$f" ] || continue
            sed -i "s/v${OLD}/v${NEW}/g" "$f" || true
          done
          if [ -f ROADMAP.md ]; then
            sed -i "s/v${OLD}/v${NEW}/g" ROADMAP.md || true
          fi

          echo "version=${NEW}" >> "$GITHUB_OUTPUT"
          echo "tag=v${NEW}" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        id: bump
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml package.json index.html ROADMAP.md docs || true
          if git diff --cached --quiet; then
            echo "No version files changed"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: bump version to ${{ steps.ver.outputs.version }} [skip release]"
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            libx11-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Prepare asset
        run: |
          cp target/release/rail target/release/rail-linux-x86_64
          sha256sum target/release/rail-linux-x86_64 | tee SHA256SUMS
          ./target/release/rail --version || true

      - name: Create tag & GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ steps.bump.outputs.sha }}
          generate_release_notes: true
          files: |
            target/release/rail-linux-x86_64
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
