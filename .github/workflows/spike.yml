name: Spike (tao+wry)

on:
  push:
    branches: [main]
    paths:
      - 'examples/spike-tao-wry/**'
      - '.github/workflows/spike.yml'
  pull_request:
    paths:
      - 'examples/spike-tao-wry/**'

jobs:
  spike:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-latest
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build spike
        working-directory: examples/spike-tao-wry
        run: cargo build --release
